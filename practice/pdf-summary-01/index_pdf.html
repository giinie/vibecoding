<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF 문서 요약 AI</title>
    <meta name="description" content="PDF 파일을 업로드하면 AI가 핵심 내용을 요약해 드립니다">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 900px;
            width: 100%;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 16px;
            opacity: 0.9;
        }

        .content {
            padding: 40px 30px;
        }

        .upload-section {
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 60px 30px;
            text-align: center;
            background: #f8f9ff;
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .drop-zone:hover,
        .drop-zone.drag-over {
            border-color: #764ba2;
            background: #f0f1ff;
            transform: scale(1.02);
        }

        .drop-zone:focus {
            outline: 3px solid #764ba2;
            outline-offset: 2px;
        }

        .drop-zone-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }

        .drop-zone-text {
            font-size: 18px;
            color: #667eea;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .drop-zone-subtext {
            font-size: 14px;
            color: #6b7280;
        }

        .file-input {
            display: none;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
            transition: all 0.3s ease;
        }

        .upload-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .upload-button:focus {
            outline: 3px solid #764ba2;
            outline-offset: 2px;
        }

        .upload-button:active {
            transform: translateY(0);
        }

        .upload-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .progress-section {
            display: none;
            margin: 30px 0;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e5e7eb;
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            width: 0%;
            transition: width 0.3s ease;
        }

        .progress-text {
            text-align: center;
            color: #667eea;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #e5e7eb;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result-section {
            display: none;
            margin-top: 30px;
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 24px;
            font-weight: 700;
            color: #1f2937;
        }

        .copy-button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .copy-button:hover {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .copy-button:focus {
            outline: 3px solid #764ba2;
            outline-offset: 2px;
        }

        .summary-content {
            background: #f8f9ff;
            border-radius: 12px;
            padding: 30px;
            line-height: 1.8;
            color: #374151;
            border-left: 4px solid #667eea;
        }

        .summary-content h1,
        .summary-content h2,
        .summary-content h3 {
            color: #667eea;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        .summary-content h1:first-child,
        .summary-content h2:first-child,
        .summary-content h3:first-child {
            margin-top: 0;
        }

        .summary-content h1 {
            font-size: 24px;
            border-bottom: 2px solid #e5e7eb;
            padding-bottom: 10px;
        }

        .summary-content h2 {
            font-size: 20px;
        }

        .summary-content h3 {
            font-size: 18px;
        }

        .summary-content ul,
        .summary-content ol {
            margin-left: 25px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .summary-content li {
            margin-bottom: 8px;
        }

        .summary-content p {
            margin-bottom: 15px;
        }

        .summary-content p:last-child {
            margin-bottom: 0;
        }

        .summary-content strong {
            color: #667eea;
            font-weight: 600;
        }

        .message {
            padding: 15px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            background: #d1fae5;
            color: #065f46;
            border-left: 4px solid #10b981;
        }

        .message.error {
            background: #fee2e2;
            color: #991b1b;
            border-left: 4px solid #ef4444;
        }

        .file-info {
            display: none;
            background: #f0f1ff;
            padding: 15px 20px;
            border-radius: 10px;
            margin-top: 20px;
            color: #667eea;
            font-size: 14px;
        }

        .file-info strong {
            font-weight: 600;
        }

        .new-file-button {
            display: none;
            margin-top: 20px;
            background: #f3f4f6;
            color: #667eea;
            border: 2px solid #667eea;
            padding: 12px 30px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .new-file-button:hover {
            background: #667eea;
            color: white;
        }

        .new-file-button:focus {
            outline: 3px solid #764ba2;
            outline-offset: 2px;
        }

        /* 반응형 디자인 */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .header p {
                font-size: 14px;
            }

            .content {
                padding: 30px 20px;
            }

            .drop-zone {
                padding: 40px 20px;
            }

            .drop-zone-icon {
                font-size: 48px;
            }

            .drop-zone-text {
                font-size: 16px;
            }

            .result-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .copy-button {
                width: 100%;
            }

            .summary-content {
                padding: 20px;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 20px;
            }

            .content {
                padding: 20px 15px;
            }

            .drop-zone {
                padding: 30px 15px;
            }

            .summary-content h1 {
                font-size: 20px;
            }

            .summary-content h2 {
                font-size: 18px;
            }

            .summary-content h3 {
                font-size: 16px;
            }
        }

        /* 접근성 개선 - 포커스 스타일 */
        :focus-visible {
            outline: 3px solid #764ba2;
            outline-offset: 2px;
        }

        /* 스크린 리더 전용 텍스트 */
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }
    </style>
</head>
<body>
    <div class="container" role="main">
        <header class="header">
            <h1>📄 PDF 문서 요약 AI</h1>
            <p>PDF 파일을 업로드하면 AI가 핵심 내용을 요약해 드립니다</p>
        </header>

        <div class="content">
            <!-- 메시지 영역 -->
            <div id="message" class="message" role="alert" aria-live="polite"></div>

            <!-- 업로드 영역 -->
            <section class="upload-section" aria-label="파일 업로드">
                <div id="dropZone" class="drop-zone" tabindex="0" role="button" aria-label="PDF 파일을 드래그하거나 클릭하여 업로드">
                    <div class="drop-zone-icon" aria-hidden="true">📎</div>
                    <div class="drop-zone-text">PDF 파일을 여기에 드래그하세요</div>
                    <div class="drop-zone-subtext">또는 아래 버튼을 클릭하여 파일을 선택하세요</div>
                    <input type="file" id="fileInput" class="file-input" accept=".pdf,application/pdf" aria-label="PDF 파일 선택">
                    <button id="uploadButton" class="upload-button" type="button">
                        파일 선택
                    </button>
                </div>
                <div id="fileInfo" class="file-info" aria-live="polite"></div>
            </section>

            <!-- 진행 상태 영역 -->
            <section id="progressSection" class="progress-section" aria-label="처리 진행 상태">
                <div class="progress-bar-container" role="progressbar" aria-valuenow="0" aria-valuemin="0" aria-valuemax="100">
                    <div id="progressBar" class="progress-bar"></div>
                </div>
                <div id="progressText" class="progress-text" aria-live="polite">
                    <span id="progressLabel">준비 중...</span>
                    <span class="loading-spinner" aria-hidden="true"></span>
                </div>
            </section>

            <!-- 요약 결과 영역 -->
            <section id="resultSection" class="result-section" aria-label="요약 결과">
                <div class="result-header">
                    <h2 class="result-title">요약 결과</h2>
                    <button id="copyButton" class="copy-button" type="button" aria-label="요약 내용을 클립보드에 복사">📋 복사하기</button>
                </div>
                <article id="summaryContent" class="summary-content" tabindex="0"></article>
                <button id="newFileButton" class="new-file-button" type="button">새 파일 업로드</button>
            </section>
        </div>
    </div>

    <script>
        // PDF.js 워커 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // DOM 요소
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const uploadButton = document.getElementById('uploadButton');
        const fileInfo = document.getElementById('fileInfo');
        const progressSection = document.getElementById('progressSection');
        const progressBar = document.getElementById('progressBar');
        const progressLabel = document.getElementById('progressLabel');
        const resultSection = document.getElementById('resultSection');
        const summaryContent = document.getElementById('summaryContent');
        const copyButton = document.getElementById('copyButton');
        const newFileButton = document.getElementById('newFileButton');
        const messageDiv = document.getElementById('message');

        // 전역 변수
        let extractedText = '';
        let currentPdfDoc = null;
        let isProcessing = false;

        // 파일 선택 버튼 클릭
        uploadButton.addEventListener('click', () => {
            if (!isProcessing) {
                fileInput.click();
            }
        });

        // 드래그 존 클릭
        dropZone.addEventListener('click', (e) => {
            if (e.target !== uploadButton && !isProcessing) {
                fileInput.click();
            }
        });

        // 드래그 존 키보드 접근성
        dropZone.addEventListener('keydown', (e) => {
            if ((e.key === 'Enter' || e.key === ' ') && !isProcessing) {
                e.preventDefault();
                fileInput.click();
            }
        });

        // 드래그&드롭 이벤트
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            if (!isProcessing) {
                dropZone.classList.add('drag-over');
            }
        });

        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');

            if (isProcessing) return;

            const files = e.dataTransfer.files;
            if (files.length > 0) {
                handleFile(files[0]);
            }
        });

        // 파일 선택 이벤트
        fileInput.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                handleFile(file);
            }
        });

        // 새 파일 업로드 버튼
        newFileButton.addEventListener('click', () => {
            resetUI();
            fileInput.click();
        });

        // UI 초기화
        function resetUI() {
            resultSection.style.display = 'none';
            newFileButton.style.display = 'none';
            fileInfo.style.display = 'none';
            hideMessage();
            hideProgress();
            fileInput.value = '';
            extractedText = '';
            cleanupPdfDocument();
        }

        // PDF 문서 메모리 정리
        function cleanupPdfDocument() {
            if (currentPdfDoc) {
                currentPdfDoc.destroy();
                currentPdfDoc = null;
            }
        }

        // 파일 처리 함수
        async function handleFile(file) {
            // 중복 처리 방지
            if (isProcessing) {
                showMessage('이미 파일을 처리하고 있습니다. 잠시 기다려 주세요.', 'error');
                return;
            }

            // 파일 검증
            if (file.type !== 'application/pdf' && !file.name.toLowerCase().endsWith('.pdf')) {
                showMessage('PDF 파일만 업로드할 수 있습니다.', 'error');
                return;
            }

            const maxSize = 50 * 1024 * 1024; // 50MB 제한
            if (file.size > maxSize) {
                showMessage('파일 크기는 50MB를 초과할 수 없습니다.', 'error');
                return;
            }

            isProcessing = true;
            uploadButton.disabled = true;

            // UI 초기화
            hideMessage();
            resultSection.style.display = 'none';
            newFileButton.style.display = 'none';

            // 이전 PDF 문서 정리
            cleanupPdfDocument();

            // 파일 정보 표시
            fileInfo.style.display = 'block';
            fileInfo.innerHTML = `<strong>선택된 파일:</strong> ${escapeHtml(file.name)} (${formatFileSize(file.size)})`;

            // 진행 상태 표시
            showProgress('파일을 읽는 중...', 10);

            try {
                // PDF 텍스트 추출
                extractedText = await extractTextFromPDF(file);

                if (!extractedText || extractedText.trim().length === 0) {
                    throw new Error('PDF에서 텍스트를 추출할 수 없습니다. 이미지 기반 PDF일 수 있습니다.');
                }

                showProgress('텍스트 추출 완료, AI 요약 생성 중...', 60);

                // AI 요약 생성
                const summary = await generateSummary(extractedText);

                showProgress('요약 완료!', 100);

                // 결과 표시
                displaySummary(summary);
                showMessage('요약이 성공적으로 생성되었습니다!', 'success');

                setTimeout(() => {
                    hideProgress();
                    newFileButton.style.display = 'block';
                }, 1000);

            } catch (error) {
                console.error('Error:', error);
                showMessage(`오류가 발생했습니다: ${error.message}`, 'error');
                hideProgress();
            } finally {
                isProcessing = false;
                uploadButton.disabled = false;
            }
        }

        // PDF 텍스트 추출 함수
        async function extractTextFromPDF(file) {
            showProgress('PDF 로딩 중...', 20);

            const arrayBuffer = await file.arrayBuffer();
            currentPdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

            const textParts = [];
            const totalPages = currentPdfDoc.numPages;

            for (let i = 1; i <= totalPages; i++) {
                // 진행률 업데이트 (너무 자주 하지 않음)
                if (i === 1 || i === totalPages || i % 5 === 0) {
                    showProgress(`페이지 ${i}/${totalPages} 추출 중...`, 20 + (i / totalPages) * 40);
                }

                const page = await currentPdfDoc.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(' ');
                textParts.push(pageText);
            }

            return textParts.join('\n\n').trim();
        }

        // AI 요약 생성 함수
        async function generateSummary(text) {
            showProgress('AI 요약 요청 중...', 70);

            // 텍스트 크기 제한 (클라이언트 사이드)
            const maxTextLength = 80000; // 80KB
            let truncatedText = text;
            if (text.length > maxTextLength) {
                truncatedText = text.substring(0, maxTextLength) + '\n\n[... 이하 생략 ...]';
            }

            const response = await fetch('/api/summarize', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ text: truncatedText })
            });

            if (!response.ok) {
                let errorMessage = '요약 생성에 실패했습니다.';
                try {
                    const errorData = await response.json();
                    errorMessage = errorData.error || errorMessage;
                } catch (e) {
                    // JSON 파싱 실패 시 기본 에러 메시지 사용
                }
                throw new Error(errorMessage);
            }

            showProgress('AI 응답 처리 중...', 90);

            const data = await response.json();

            if (!data.success) {
                throw new Error(data.error || '요약 생성에 실패했습니다.');
            }

            return data.summary;
        }

        // 개선된 마크다운 HTML 변환 함수
        function markdownToHtml(markdown) {
            if (!markdown) return '';

            let html = markdown;

            // 헤더 변환
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // 강조 변환 (순서 중요)
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');

            // 목록 처리 (개선된 로직)
            const lines = html.split('\n');
            const processedLines = [];
            let inUnorderedList = false;
            let inOrderedList = false;

            for (let i = 0; i < lines.length; i++) {
                let line = lines[i];

                // 비순서형 목록
                const ulMatch = line.match(/^[-*] (.+)$/);
                // 순서형 목록
                const olMatch = line.match(/^\d+\. (.+)$/);

                if (ulMatch) {
                    if (inOrderedList) {
                        processedLines.push('</ol>');
                        inOrderedList = false;
                    }
                    if (!inUnorderedList) {
                        processedLines.push('<ul>');
                        inUnorderedList = true;
                    }
                    processedLines.push(`<li>${ulMatch[1]}</li>`);
                } else if (olMatch) {
                    if (inUnorderedList) {
                        processedLines.push('</ul>');
                        inUnorderedList = false;
                    }
                    if (!inOrderedList) {
                        processedLines.push('<ol>');
                        inOrderedList = true;
                    }
                    processedLines.push(`<li>${olMatch[1]}</li>`);
                } else {
                    if (inUnorderedList) {
                        processedLines.push('</ul>');
                        inUnorderedList = false;
                    }
                    if (inOrderedList) {
                        processedLines.push('</ol>');
                        inOrderedList = false;
                    }
                    processedLines.push(line);
                }
            }

            // 마지막 목록 닫기
            if (inUnorderedList) processedLines.push('</ul>');
            if (inOrderedList) processedLines.push('</ol>');

            html = processedLines.join('\n');

            // 빈 줄을 단락으로 변환
            html = html.replace(/\n\n+/g, '</p><p>');
            html = html.replace(/\n/g, '<br>');

            // 시작과 끝에 단락 태그 추가 (헤더로 시작하지 않는 경우)
            if (!html.trim().startsWith('<h') && !html.trim().startsWith('<ul') && !html.trim().startsWith('<ol')) {
                html = '<p>' + html + '</p>';
            }

            // 빈 단락 제거
            html = html.replace(/<p><\/p>/g, '');
            html = html.replace(/<p><br><\/p>/g, '');
            html = html.replace(/<p>\s*<\/p>/g, '');

            return html;
        }

        // 요약 결과 표시 함수 (DOMPurify 사용)
        function displaySummary(summary) {
            // 먼저 DOMPurify로 원본 텍스트 정제
            const cleanSummary = DOMPurify.sanitize(summary, {
                ALLOWED_TAGS: [],
                ALLOWED_ATTR: []
            });

            // 정제된 텍스트를 마크다운으로 변환
            const html = markdownToHtml(cleanSummary);

            // 변환된 HTML을 다시 정제
            const cleanHtml = DOMPurify.sanitize(html, {
                ALLOWED_TAGS: ['h1', 'h2', 'h3', 'p', 'ul', 'ol', 'li', 'strong', 'em', 'br'],
                ALLOWED_ATTR: []
            });

            summaryContent.innerHTML = cleanHtml;
            resultSection.style.display = 'block';

            // 결과로 스크롤
            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 300);
        }

        // 복사 버튼 이벤트
        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(summaryContent.innerText);

                const originalText = copyButton.textContent;
                copyButton.textContent = '✅ 복사됨!';
                copyButton.style.background = '#10b981';

                setTimeout(() => {
                    copyButton.textContent = originalText;
                    copyButton.style.background = '';
                }, 2000);

            } catch (error) {
                showMessage('복사에 실패했습니다. 브라우저 설정을 확인해 주세요.', 'error');
            }
        });

        // 유틸리티 함수들
        function showProgress(text, percentage) {
            progressSection.style.display = 'block';
            progressBar.style.width = percentage + '%';
            progressLabel.textContent = text;

            // 접근성: progressbar 값 업데이트
            const progressContainer = progressBar.parentElement;
            progressContainer.setAttribute('aria-valuenow', percentage);
        }

        function hideProgress() {
            progressSection.style.display = 'none';
            progressBar.style.width = '0%';
        }

        function showMessage(text, type) {
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            messageDiv.style.display = 'block';

            if (type === 'success') {
                setTimeout(hideMessage, 5000);
            }
        }

        function hideMessage() {
            messageDiv.style.display = 'none';
        }

        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
